name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_NAME: Trading Bot Control
      VITE_N8N_WEBHOOK_BASE_URL: https://almaz2607kz.app.n8n.cloud/webhook
      VITE_ALLOWED_USER_ID: "8300266144"
      VITE_REQUEST_TIMEOUT_MS: "20000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MINI_APP_URL: https://87082099782a-afk.github.io/trading-bot-miniapp/
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Configure Telegram menu button
        if: env.TELEGRAM_BOT_TOKEN != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          app_url = os.environ["MINI_APP_URL"]
          base = f"https://api.telegram.org/bot{token}"

          def post(method, payload):
              data = urllib.parse.urlencode(payload).encode()
              request = urllib.request.Request(f"{base}/{method}", data=data, method="POST")
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.loads(response.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(f"{method} failed")

          post("setChatMenuButton", {
              "menu_button": json.dumps({
                  "type": "web_app",
                  "text": "Trading Bot",
                  "web_app": {"url": app_url}
              })
          })
          post("setMyCommands", {
              "commands": json.dumps([
                  {"command": "start", "description": "Запустить панель"},
                  {"command": "status", "description": "Статус бота"},
                  {"command": "signals", "description": "Сигналы"},
                  {"command": "stop", "description": "Остановить"},
                  {"command": "emergency", "description": "Emergency Stop"},
                  {"command": "help", "description": "Помощь"}
              ])
          })
          PY
